version: 1
id: chat-stream
config:
  max_body_bytes: 8388608
  read_body_timeout: 15s
  stream: true
  status: 200
  headers:
    Cache-Control: no-cache
  line_ending: crlf
  usage:
    input_tokens: 8
    output_tokens: 12
assert:
  - name: messages_type
    key: request.json_body
    path: $.messages
    op: type
    expected: array
  - name: messages_not_empty
    key: request.json_body
    path: $.messages
    op: length_gte
    expected: 1
  - name: stream
    key: request.stream
    op: eq
    expected: true
  - name: method
    key: request.method
    op: eq
    expected: POST
rounds:
  - output:
      content: 你好
