version: 1
id: multimodal
# 多模态输入断言示例：请求携带图片内容块时返回不同文本，并断言图片块存在。
config:
  stream: false
assert:
  - name: content_is_array
    key: request.json_body
    path: $.messages[0].content
    op: type
    expected: array
  - name: has_image_block
    key: request.json_body
    path: $.messages[0].content[1].type
    op: eq
    expected: image_url
rounds:
  - output:
      content: 我看到一张图片，正在描述它的内容。
